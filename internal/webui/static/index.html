<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>screentyme</title>
<style>
  :root {
    --bg: #eceae4;
    --surface: #ffffff;
    --surface-2: #f4f3ef;
    --border: #2b2b2b;
    --border-light: #d0cec5;
    --text: #111820;
    --muted: #5b616b;
    --accent: #003366;
    --accent-red: #d63e04;
    --radius: 2px;
    --serif: "Georgia", "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: "Courier New", Courier, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }
  h1, h2, h3 { font-family: var(--serif); font-weight: normal; margin: 0; color: var(--text); }
  h1 { font-size: 22px; text-transform: uppercase; letter-spacing: 1px; color: var(--surface); }
  h2 { font-size: 16px; border-bottom: 2px solid var(--border); padding-bottom: 6px; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: bold; }

  header {
    border-bottom: 4px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    color: var(--text);
  }
  header h1 { color: var(--text); font-weight: bold; letter-spacing: 0; }
  .dur-link {
    cursor: pointer;
    font-family: var(--mono);
    text-transform: uppercase;
    font-size: 13px;
    transition: opacity 0.2s;
  }
  .dur-link:hover { opacity: 0.8; }
  .dur-link.active { font-weight: bold; color: var(--accent-red); }
  .controls { display: flex; gap: 8px; align-items: center; font-family: var(--mono); font-size: 13px; }

  .content { max-width: 800px; margin: 0 auto; padding: 32px 24px; display: flex; flex-direction: column; gap: 40px; }

  /* App Grid */
  .app-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; }
  .app-card { border: 2px solid var(--border); background: var(--surface); padding: 16px; text-align: center; }
  .app-card-name { font-family: var(--mono); font-weight: bold; font-size: 14px; margin-bottom: 8px; border-bottom: 1px dotted var(--border-light); padding-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-transform: uppercase;}
  .app-card-time { font-family: var(--serif); font-size: 22px; color: var(--text); }
  .app-card-meta { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 8px; text-transform: uppercase; }

  /* Bars */
  .bar-list { display: flex; flex-direction: column; gap: 8px; }
  .bar-row {
    display: grid; grid-template-columns: 200px 1fr 140px; gap: 12px; align-items: center;
  }
  .bar-app { font-family: var(--mono); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { height: 14px; background: var(--surface-2); border: 1px solid var(--border-light); }
  .bar-fill { height: 100%; transition: width 0.3s; background: var(--text); }
  .bar-time { font-family: var(--mono); font-size: 13px; text-align: right; display: flex; justify-content: flex-end; align-items: center; gap: 8px; }

  .btn-track {
    cursor: pointer; background: transparent; border: 1px solid var(--border);
    font-family: var(--mono); font-size: 10px; text-transform: uppercase;
    padding: 2px 6px; border-radius: var(--radius); transition: all 0.1s;
    white-space: nowrap; visibility: hidden; opacity: 0;
  }
  .bar-row:hover .btn-track { visibility: visible; opacity: 1; }
  .btn-track:hover { background: var(--border); color: var(--surface); }

  /* Forms */
  input, button {
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    padding: 4px 8px; font-family: var(--mono); font-size: 11px; border-radius: var(--radius);
  }
  button { cursor: pointer; text-transform: uppercase; font-weight: bold; }
  button:hover { background: var(--border-light); }
  
  .inline-form { display: flex; gap: 4px; align-items: center; justify-content: flex-end; }
  .inline-form input { width: 100px; }

  .empty { color: var(--muted); font-family: var(--mono); padding: 20px 0; text-transform: uppercase; font-size: 12px; border: 1px dashed var(--border-light); text-align: center; }
  .error { background: #ffebeb; color: var(--accent-red); padding: 12px; border: 1px solid var(--accent-red); margin-bottom: 16px; font-family: var(--mono); }
  .loading { font-family: var(--mono); text-transform: uppercase; padding: 20px; color: var(--accent); text-align: center; font-weight: bold; }
</style>
</head>
<body>
<header>
  <h1>screentyme</h1>
  <div class="controls" id="duration-controls">
    <span class="dur-link" data-days="1">today</span> /
    <span class="dur-link active" data-days="7">7d</span> /
    <span class="dur-link" data-days="30">30d</span>
  </div>
</header>

<main class="content">
  <div id="error" class="error" style="display:none"></div>

  <div>
    <h2>Today at a glance</h2>
    <div id="today-grid" class="app-list"></div>
  </div>

  <div>
    <h2>Tracked Keywords (<span class="days-label">7</span>d)</h2>
    <div id="tracked-list" class="bar-list"></div>
  </div>

  <div id="untracked-wrap"></div>
</main>

<script>
const api = {
  async get(path) {
    const r = await fetch(path);
    if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
    return r.json();
  },
  async post(path, body) {
    const r = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
    return r.status === 204 ? null : r.json().catch(() => null);
  }
};

function fmtDuration(s) {
  s = Math.round(s || 0);
  if (s < 60) return s + 's';
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  if (h === 0) return m + 'm';
  return h + 'h ' + m + 'm';
}

const PALETTE = ['#003366','#d63e04','#4b6f4a','#947e45','#5c6575','#7b2b2a','#3a516e','#ab4a24','#6a7b63','#4b4342'];
function colorFor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return PALETTE[Math.abs(h) % PALETTE.length];
}

function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  attrs = attrs || {};
  for (const k of Object.keys(attrs)) {
    const v = attrs[k];
    if (k === 'class') e.className = v;
    else if (k === 'style') Object.assign(e.style, v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of children) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(c));
  }
  return e;
}
function empty(msg) { return el('div', { class: 'empty' }, msg); }
function loading() { return el('div', { class: 'loading' }, 'Loading...'); }

const state = { days: 7 };

document.getElementById('duration-controls').addEventListener('click', (ev) => {
  if (ev.target.classList.contains('dur-link')) {
    document.querySelectorAll('.dur-link').forEach(n => n.classList.remove('active'));
    ev.target.classList.add('active');
    state.days = parseInt(ev.target.getAttribute('data-days'), 10) || 7;
    refreshAll();
  }
});

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 4000);
}

async function renderToday() {
  const wrap = document.getElementById('today-grid');
  wrap.replaceChildren(loading());
  try {
    const { apps } = await api.get('/api/analytics/today');
    if (!apps || apps.length === 0) {
      wrap.replaceChildren(empty('No records found for today.'));
      return;
    }
    const list = document.createDocumentFragment();
    for (const a of apps) {
      list.append(el('div', { class: 'app-card', style: { borderTopColor: colorFor(a.app_class) } },
        el('div', { class: 'app-card-name', title: a.app_class, style: { color: colorFor(a.app_class) } }, a.app_class),
        el('div', { class: 'app-card-time' }, fmtDuration(a.total_seconds)),
        el('div', { class: 'app-card-meta' }, a.session_count + ' sess')
      ));
    }
    wrap.replaceChildren(list);
  } catch (e) {
    wrap.replaceChildren(empty('Retrieval Error.'));
    showError('today: ' + e.message);
  }
}

async function renderTracked() {
  const wrap = document.getElementById('tracked-list');
  wrap.replaceChildren(loading());
  try {
    const { keywords } = await api.get('/api/keywords/totals?days=' + state.days);
    if (!keywords || keywords.length === 0) {
      wrap.replaceChildren(empty('No tracked keywords.'));
      return;
    }
    const max = Math.max(...keywords.map(k => k.total_seconds));
    const list = document.createDocumentFragment();
    for (const k of keywords) {
      const pct = (k.total_seconds / max) * 100;
      const lbl = el('span', {}, 
        el('span', {style: {color: 'var(--muted)', marginRight: '4px'}}, k.app_class + '/'), 
        el('strong', {}, k.label || k.keyword)
      );
      list.append(el('div', { class: 'bar-row' },
        el('div', { class: 'bar-app', title: k.keyword }, lbl),
        el('div', { class: 'bar-track' },
          el('div', { class: 'bar-fill', style: { width: pct + '%', background: colorFor(k.app_class) } })
        ),
        el('div', { class: 'bar-time' }, fmtDuration(k.total_seconds))
      ));
    }
    wrap.replaceChildren(list);
  } catch (e) {
    wrap.replaceChildren(empty('Retrieval Error.'));
    showError('tracked: ' + e.message);
  }
}

async function renderUntracked() {
  const wrap = document.getElementById('untracked-wrap');
  wrap.replaceChildren(loading());
  try {
    const { entries } = await api.get('/api/analytics/recent?days=' + state.days);
    if (!entries) return;
    
    // Group by app class, filtering untracked (keyword === "")
    const byApp = new Map();
    for (const e of entries) {
      if (e.keyword !== "") continue;
      if (!byApp.has(e.app_class)) byApp.set(e.app_class, []);
      byApp.get(e.app_class).push(e);
    }
    
    const root = document.createDocumentFragment();
    // Sort apps alphabetically
    const sortedApps = Array.from(byApp.entries()).sort((a, b) => a[0].localeCompare(b[0]));
    
    for (const [appClass, list] of sortedApps) {
      // Sort items by time desc and take top 10
      list.sort((a, b) => b.total_seconds - a.total_seconds);
      const topList = list.slice(0, 10);
      const max = Math.max(...topList.map(k => k.total_seconds));
      
      const appWrap = el('div', { style: { marginBottom: '32px' }});
      appWrap.append(el('h2', {style: { color: colorFor(appClass), borderBottomColor: colorFor(appClass) }}, appClass + ' — Untracked Time', el('span', {style:{color:'var(--muted)', fontSize:'11px', marginLeft:'8px'}}, '(click title to add)')));
      
      const barList = el('div', { class: 'bar-list' });
      for (const k of topList) {
        if (!k.title) continue;
        const pct = (k.total_seconds / max) * 100;
        
        const controls = el('div', { class: 'bar-time' },
          fmtDuration(k.total_seconds),
          el('button', { 
            class: 'btn-track', 
            onclick: (ev) => showInlineForm(ev.currentTarget.parentNode, appClass, k.title) 
          }, '[+ track]')
        );

        barList.append(el('div', { class: 'bar-row' },
          el('div', { class: 'bar-app', title: k.title }, k.title),
          el('div', { class: 'bar-track' },
            el('div', { class: 'bar-fill', style: { width: pct + '%', background: colorFor(appClass) } })
          ),
          controls
        ));
      }
      appWrap.append(barList);
      root.append(appWrap);
    }
    
    if (byApp.size === 0) {
      root.append(empty('No untracked data.'));
    }
    
    wrap.replaceChildren(root);
  } catch (e) {
    wrap.replaceChildren(empty('Retrieval Error.'));
    showError('untracked: ' + e.message);
  }
}

function showInlineForm(container, appClass, title) {
  // Suggest a keyword mapping
  let suggest = title.split(/[ -]/).filter(s => s.length > 2).slice(0, 2).join(' ').replace(/[^a-zA-Z0-9 ]/g, '');
  if (!suggest) suggest = title.substring(0, 15);
  
  const form = el('form', { 
    class: 'inline-form',
    onsubmit: async (e) => {
      e.preventDefault();
      try {
        await api.post('/api/keywords', {
          app_class: appClass,
          keyword: e.target.kw.value.trim(),
          label: e.target.lbl.value.trim()
        });
        refreshAll();
      } catch (err) {
        showError('Fail: ' + err.message);
      }
    }
  },
    el('input', { name: 'kw', value: suggest, required: true, title: 'Keyword match' }),
    el('input', { name: 'lbl', placeholder: 'Label', title: 'Display Label' }),
    el('button', { type: 'submit' }, 'Save')
  );
  
  container.replaceChildren(form);
  form.kw.focus();
  form.kw.select();
}

function refreshAll() {
  document.querySelectorAll('.days-label').forEach(n => n.textContent = state.days);
  renderToday();
  renderTracked();
  renderUntracked();
}

refreshAll();
</script>
</body>
</html>
